chat_item:
  class: chat_item

  chat_item_icon:
    class: chat_item_icon
    img: "{{ci_icon, 'star_on'}}"
    passive: true

  chat_item_body:
    class: chat_item_body
    passive: true

    chat_item_title:
      class: chat_item_title
      text: "{{ci_title, 'New Chat'}}"
      font: NeueMontreal-Regular
      passive: true

    chat_item_date:
      class: chat_item_date
      text: "{{ci_date, 'Today'}}"
      font: NeueMontreal-Regular
      passive: true
      passive: true
