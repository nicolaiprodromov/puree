                      font: NeueMontreal-Regular
                      passive: true

                  log_entry_11:
                    class: log_entry

                    log_entry_11_dot:
                      class: log_dot log_dot_violet
                      passive: true

                    log_entry_11_text:
                      class: log_text
                      text: Hot reload watcher initialized
                      font: NeueMontreal-Regular
                      passive: true

                    log_entry_11_time:
                      class: log_time
