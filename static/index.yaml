app:
  selected_theme: example5_theme
  default_theme: example5_theme

  theme:
    - name: example5_theme
      author: Copilot
      version: 2.1.0
      default_font: NeueMontreal-Regular
      scripts:
        - static/script.py
      styles:
        - static/style.scss
      components: static/components/

      root:
        class: root

        shell:
          class: shell

          sidebar:
            class: sidebar

            sidebar_header:
              class: sidebar_header

              sidebar_label:
                class: sidebar_label
                text: Conversations
                passive: true

              new_chat_btn:
                class: new_chat_btn

                new_chat_text:
                  class: new_chat_text
                  text: New chat
                  passive: true

            sidebar_intro:
              class: sidebar_intro

              intro_eyebrow:
                class: intro_eyebrow
                text: Viewport Copilot
                passive: true

              intro_title:
                class: intro_title
                text: Scene HLEP that stays inside Blender.
                passive: true

              intro_copy:
                class: intro_copy
                text: Geometry, materials, lighting, and scene actions in one thread.
                passive: true

            chat_section_label:
              class: chat_section_label
              text: Recent threads
              passive: true

            chat_list:
              class: chat_list

              chat_slot_0:
                data: '[chat_item]'
                ci_title: ' '
                ci_date: ' '
                ci_height: '0px'
                ci_opacity: '0'
                ci_padding: '0px'
                ci_border_width: '0px'
                ci_icon_size: '0px'

              chat_slot_1:
                data: '[chat_item]'
                ci_title: ' '
                ci_date: ' '
                ci_height: '0px'
                ci_opacity: '0'
                ci_padding: '0px'
                ci_border_width: '0px'
                ci_icon_size: '0px'

              chat_slot_2:
                data: '[chat_item]'
                ci_title: ' '
                ci_date: ' '
                ci_height: '0px'
                ci_opacity: '0'
                ci_padding: '0px'
                ci_border_width: '0px'
                ci_icon_size: '0px'

              chat_slot_3:
                data: '[chat_item]'
                ci_title: ' '
                ci_date: ' '
                ci_height: '0px'
                ci_opacity: '0'
                ci_padding: '0px'
                ci_border_width: '0px'
                ci_icon_size: '0px'

              chat_slot_4:
                data: '[chat_item]'
                ci_title: ' '
                ci_date: ' '
                ci_height: '0px'
                ci_opacity: '0'
                ci_padding: '0px'
                ci_border_width: '0px'
                ci_icon_size: '0px'

              chat_slot_5:
                data: '[chat_item]'
                ci_title: ' '
                ci_date: ' '
                ci_height: '0px'
                ci_opacity: '0'
                ci_padding: '0px'
                ci_border_width: '0px'
                ci_icon_size: '0px'

          main:
            class: main

            main_header:
              class: main_header

              header_block:
                class: header_block

                header_kicker:
                  class: header_kicker
                  text: Blender assistant
                  passive: true

                header_title:
                  class: header_title
                  text: ' '
                  passive: true

              model_selector:
                class: model_selector

                model_dot:
                  class: model_dot
                  passive: true

                model_name:
                  class: model_name
                  text: Claude Sonnet
                  passive: true

            home_page:
              class: home_page

              home_icon:
                class: home_icon
                img: star_on
                passive: true

              home_title:
                class: home_title
                text: Viewport Copilot
                passive: true

              home_subtitle:
                class: home_subtitle
                text: Start a new conversation to get help with your scene.
                passive: true

              home_start_btn:
                class: home_start_btn

                home_start_text:
                  class: home_start_text
                  text: New conversation

            messages_scroll:
              class: messages_scroll

              message_0:
                data: '[msg_slot]'
              message_1:
                data: '[msg_slot]'
              message_2:
                data: '[msg_slot]'
              message_3:
