              message_15:
                data: '[msg_slot]'

            input_area:
              class: input_area

              attach_row:
                class: attach_row

                attach_obj_btn:
                  class: attach_pill

                  attach_obj_icon:
                    class: attach_pill_icon
                    img: dial
                    passive: true

                  attach_obj_text:
                    class: attach_pill_text
                    text: Object
                    passive: true

                attach_file_btn:
                  class: attach_pill

                  attach_file_icon:
                    class: attach_pill_icon
                    img: toggle
                    passive: true

                  attach_file_text:
                    class: attach_pill_text
                    text: File
                    passive: true

              input_row:
                class: input_row

                input_field:
                  class: input_field
                  data: "<INPUT>|Ask about this scene..."

                send_btn:
                  class: send_btn

                  send_label:
                    class: send_label
                    text: Send
                    passive: true

              input_hint:
                class: input_hint
                text: "Tip: attach selected objects with @Object or add file refs with #file:"
                passive: true
