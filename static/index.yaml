                    log_entry_7_text:
                      class: log_text
                      text: Image assets loaded — 8 icons resolved
                      font: NeueMontreal-Regular
                      passive: true

                    log_entry_7_time:
                      class: log_time
                      text: 0.5s
                      font: NeueMontreal-Regular
                      passive: true

                  log_entry_8:
                    class: log_entry

                    log_entry_8_dot:
                      class: log_dot log_dot_gold
