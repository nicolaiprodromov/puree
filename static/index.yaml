                  log_entry_9:
                    class: log_entry

                    log_entry_9_dot:
                      class: log_dot log_dot_blue
                      passive: true

                    log_entry_9_text:
                      class: log_text
                      text: Script callbacks registered for 5 handlers
                      font: NeueMontreal-Regular
                      passive: true

                    log_entry_9_time:
                      class: log_time
                      text: 0.6s
                      font: NeueMontreal-Regular
                      passive: true

                  log_entry_10:
                    class: log_entry

                    log_entry_10_dot:
                      class: log_dot log_dot_mint
                      passive: true

                    log_entry_10_text:
                      class: log_text
                      text: First frame rendered at 60 FPS
                      font: NeueMontreal-Regular
