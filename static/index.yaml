                  log_entry_6:
                    class: log_entry

                    log_entry_6_dot:
                      class: log_dot log_dot_mint
                      passive: true

                    log_entry_6_text:
                      class: log_text
                      text: Text extraction complete — 22 blocks
                      font: NeueMontreal-Regular
                      passive: true

                    log_entry_6_time:
                      class: log_time
