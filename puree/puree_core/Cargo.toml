[package]
name = "puree_rust_core"
version = "0.1.3"
edition = "2021"

[lib]
name = "puree_rust_core"
crate-type = ["cdylib"]

# `extension-module` must NOT be linked into the `cargo test` binary: the feature tells
# the linker to leave the Python C-API unresolved (the host Python provides it when the
# .so is imported), so a standalone test executable fails to link on Linux/macOS.
# Shipped builds (build.sh/build.bat, `cargo build`) use the default = extension module;
# tests run with `cargo test --no-default-features` and link libpython instead.
# https://pyo3.rs/v0.20.3/faq#i-cant-run-cargo-test-or-i-cant-build-in-a-cargo-workspace-im-having-linker-issues-like-symbol-not-found-or-undefined-reference-to-_pyexc_systemerror
[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[build-dependencies]
# build.rs: `-undefined dynamic_lookup` for macOS extension modules (see build.rs).
pyo3-build-config = "0.20"

[dependencies]
pyo3 = { version = "0.20", features = ["abi3-py311"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rayon = "1.8"
lightningcss = "1.0.0-alpha.57"
grass = "0.13"
cssparser = "0.31"
once_cell = "1.19"
regex = "1.10"
csscolorparser = "0.7"
palette = "0.7"
notify = "6.1"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["gif"] }
gif = "0.13"
resvg = "0.47"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
