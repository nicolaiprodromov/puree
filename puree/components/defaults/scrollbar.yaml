# Puree default scrollbar component
# This is a virtual component — rendered programmatically by render.py
# No YAML tree is needed; this file documents the scrollbar's structure.
# It is intentionally all comments (no root mapping) so the defaults loader
# skips it — it is NOT a loadable component template.
#
# The scrollbar consists of two visual elements drawn per scroll container:
#   - track: full-height background strip on the right edge
#   - thumb: proportionally-sized indicator showing current scroll position
#
# Customise via CSS properties on any overflow:scroll container.
#
# scrollbar:
#   track:
#     passive: true
#   thumb:
#     passive: true
