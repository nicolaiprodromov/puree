app:
  selected_theme: test_suite
  default_theme: test_suite
  theme:
    - name: test_suite
      author: puree_tests
      version: 1.0.0
      default_font: NeueMontreal-Regular
      styles:
        - tests/example0/style.scss
      scripts:
        - tests/example0/script.py
      components: tests/example0/components/
      root:
        style: root
        scroll_wrap:
          style: scroll_wrap

          # ═══════════════════════════════════════
          # HEADER
          # ═══════════════════════════════════════
          header:
            style: header
            header_left:
              style: header_left
              header_title:
                style: header_title
                text: "PUREE TEST SUITE"
                font: NeueMontreal-Bold
                passive: true
              header_subtitle:
                style: header_subtitle
                text: "Visual verification of all framework features"
                font: NeueMontreal-Italic
                passive: true
            header_right:
              style: header_right
              header_logo:
                style: header_logo
                img: loggoui2
                passive: true
              status_label:
                style: status_label
                text: "READY"
                font: NeueMontreal-Bold
                passive: true

          # ═══════════════════════════════════════
          # 1. TYPOGRAPHY
          # ═══════════════════════════════════════
          sec_typography:
            style: section
            sec_typography_title:
              style: section_title
              text: "1. TYPOGRAPHY"
              font: NeueMontreal-Bold
              passive: true

            typo_fonts_row:
              style: test_row
              typo_regular:
                data: '[test_card]'
                card_title: "Font Faces"
                badge_text: "FONTS"
                card_content: "All loaded font faces"
              typo_font_samples:
                style: test_group
                typo_f_regular:
                  style: typo_sample
                  text: "NeueMontreal Regular"
                  font: NeueMontreal-Regular
                  passive: true
                typo_f_bold:
                  style: typo_sample
                  text: "NeueMontreal Bold"
                  font: NeueMontreal-Bold
                  passive: true
                typo_f_italic:
                  style: typo_sample
                  text: "NeueMontreal Italic"
                  font: NeueMontreal-Italic
                  passive: true
                typo_f_light:
                  style: typo_sample
                  text: "NeueMontreal Light"
                  font: NeueMontreal-Light
                  passive: true
                typo_f_bolditalic:
                  style: typo_sample
                  text: "NeueMontreal BoldItalic"
                  font: NeueMontreal-BoldItalic
                  passive: true
                typo_f_lightitalic:
