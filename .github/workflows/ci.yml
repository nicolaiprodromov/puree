name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ruff is pinned to the version the repo is formatted with (also pinned in the
      # justfile). Bumping it = bump both pins, run `ruff format`, commit together.
      - name: Install dependencies
        run: pip install ruff==0.9.10 pyyaml build

      - name: Lint
        run: ruff check puree/ __init__.py tests/ dist/ setup.py

      - name: Format check
        run: ruff format --check puree/ __init__.py tests/ dist/ setup.py

      - name: YAML validation
        run: |
          python -c "
          import yaml, pathlib, sys
          errors = []
          for p in pathlib.Path('.').rglob('*.yaml'):
              if '.git' in p.parts or 'target' in p.parts:
                  continue
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  errors.append(f'{p}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          "

      - name: Package build
        run: python -m build --sdist --wheel

  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Rust version lives in puree/puree_core/rust-toolchain.toml (single source of
      # truth for local builds and CI) - never track a moving `stable` here.
      - name: Read pinned Rust version
        id: rust
        run: echo "version=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' puree/puree_core/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: puree/puree_core

      # --locked: Cargo.lock is committed; fail loudly if it is out of date instead of
      # silently re-resolving dependencies to versions nobody tested.
      - name: Build
        working-directory: puree/puree_core
        run: cargo build --release --locked

      - name: Clippy
        working-directory: puree/puree_core
        run: cargo clippy --locked -- -D warnings

      - name: Test
        working-directory: puree/puree_core
        run: cargo test --locked

      - name: Format check
        working-directory: puree/puree_core
        run: cargo fmt -- --check
