# Release pipeline.
#
#   build-native (4 runners)  ->  publish (ubuntu)
#     cargo build --release          collect native_binaries/<platform>/ from all four
#     via puree_core/build.sh|bat    dist/fetch_wheels.py     -> puree_ui wheel (all 4 binaries inside)
#                                                                + dependency wheels for every platform
#                                    blender extension build  -> one zip per platform (--split-platforms)
#                                    twine upload to PyPI (puree-ui) + GitHub release (zips + wheel)
#
# Triggers:
#   * push of a `v*` tag            -> full run, publishes to PyPI and GitHub
#   * "Run workflow" button         -> DRY RUN: builds everything, uploads the results as a
#     (workflow_dispatch)              workflow artifact, publishes NOTHING. Use it to test.
#
# The native binaries must live in per-platform folders because Linux and macOS both
# produce `puree_rust_core.so` (see puree/native_bindings.py).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'
  # The Blender extension that ships: a complete Puree project under tests/ (see dist/addon_paths.py).
  ADDON_DIR: tests/helloworld
  PUREE_ADDON_DIR: tests/helloworld
  # Used only to run `extension build`; must be >= blender_version_min in the manifest.
  BLENDER_VERSION: '5.1.0'
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build-native:
    strategy:
      fail-fast: false   # let every platform report; publish needs all four anyway
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
            # Build inside manylinux_2_28 so the .so links against glibc 2.28 - the same
            # baseline as Blender's own Linux builds and the bundled av wheel. A plain
            # runner build would require the runner's (much newer) glibc at load time.
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: macos-latest        # Apple Silicon
            platform: macos-arm64
          - os: macos-15-intel      # last x86_64 image GitHub provides (macos-13 was retired Dec 2025)
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      # Same compiler as local builds and ci.yml: read from rust-toolchain.toml.
      - name: Read pinned Rust version
        id: rust
        shell: bash
        run: echo "version=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' puree/puree_core/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: puree/puree_core

      - name: Build native core (unix)
        if: runner.os != 'Windows'
        working-directory: puree/puree_core
        env:
          # abi3 extension modules need no interpreter at build time (and the manylinux
          # container has no `python3` on PATH for pyo3 to probe).
          PYO3_NO_PYTHON: '1'
        run: ./build.sh

      - name: Build native core (windows)
        if: runner.os == 'Windows'
        working-directory: puree/puree_core
        shell: cmd
        run: build.bat

      - name: Check output
        shell: bash
        run: ls -la puree/native_binaries/${{ matrix.platform }}/

      # Building and linking is not enough - import the binary with the Python that
      # Blender ships (3.13) and run every exported entry point on real assets. This is
      # the only place the Linux and macOS binaries are ever executed before release.
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'     # the manylinux container has its own 3.13
        with:
          python-version: '3.13'

      - name: Smoke-test the freshly built core
        shell: bash
        run: |
          set -euo pipefail
          PY=python
          [ -x /opt/python/cp313-cp313/bin/python3 ] && PY=/opt/python/cp313-cp313/bin/python3
          "$PY" --version
          "$PY" - <<'EOF'
          import platform, sys
          sys.path.insert(0, "puree/native_binaries/${{ matrix.platform }}")
          import puree_rust_core as core

          w, h, frames, delays, loops = core.decode_gif("${{ env.ADDON_DIR }}/assets/demo_munky.gif")
          assert (w, h, len(frames), len(delays)) == (320, 240, 58, 58), (w, h, len(frames), len(delays))
          assert all(d >= 20 for d in delays) and loops == 0

          assert core.probe_svg("${{ env.ADDON_DIR }}/assets/demo_vector.svg") == (240.0, 180.0)
          px = core.rasterize_svg("${{ env.ADDON_DIR }}/assets/demo_vector.svg", 48, 36, "${{ env.ADDON_DIR }}/fonts")
          assert len(px) == 48 * 36 * 4 and any(px), "svg raster is empty"

          css = core.SCSSCompiler().compile("$w: 12px; .card { width: $w; }", None, None, None)
          assert "12px" in css, css

          core.HitDetector()
          print("core OK:", platform.platform(), "| python", sys.version.split()[0], "| ${{ matrix.platform }}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: puree/native_binaries/${{ matrix.platform }}/
          if-no-files-found: error

  publish:
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Collect native binaries
        uses: actions/download-artifact@v4
        with:
          path: puree/native_binaries
          pattern: native-*

      # download-artifact restores each artifact into a folder named after the ARTIFACT
      # (native-linux-x64/...); the loader expects the manifest platform id (linux-x64/...).
      - name: Rename artifact folders to platform ids
        run: |
          set -euo pipefail
          cd puree/native_binaries
          for d in native-*; do mv "$d" "${d#native-}"; done
          find . -type f | sort
          test "$(find . -type f | wc -l)" -eq 4

      - name: Resolve version (tag must match the manifest on a real release)
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version\s*=' "$ADDON_DIR/blender_manifest.toml" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run - manifest version is $VERSION, nothing will be published"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG manifest=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::tag v$TAG does not match manifest version $VERSION - run 'just bump $TAG' first"; exit 1; }

      - name: Install packaging tools
        run: python -m pip install --upgrade pip setuptools wheel build twine

      - name: Build puree_ui wheel (all four native binaries inside) and fetch dependency wheels
        run: python dist/fetch_wheels.py

      - name: Inspect wheel + manifest
        run: |
          set -euo pipefail
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("${{ env.ADDON_DIR }}/wheels/puree_ui-*.whl")[0]
          names = [n for n in zipfile.ZipFile(whl).namelist() if "native_binaries/" in n]
          print(whl); print("\n".join(sorted(names)))
          assert len(names) == 4, f"expected 4 native binaries in the wheel, found {len(names)}"
          EOF
          grep -c './wheels/' "$ADDON_DIR/blender_manifest.toml"
          git diff --stat -- "$ADDON_DIR/blender_manifest.toml"

      - name: Download Blender (for `extension build`)
        run: |
          set -euo pipefail
          # shared libraries the Blender binary links at load time, even in --background
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libice6 > /dev/null
          MAJOR_MINOR="${BLENDER_VERSION%.*}"
          URL="https://download.blender.org/release/Blender${MAJOR_MINOR}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "$URL"
          # Download and unpack OUTSIDE the workspace: `extension build` packs the whole
          # source dir, and the manifest's paths_exclude_pattern would not catch a stray
          # tarball (dry run #2 shipped a 378 MB blender.tar.xz inside every zip).
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/blender.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version | head -1

      - name: Build extension zips (one per platform)
        run: |
          set -euo pipefail
          mkdir -p release_out
          "$RUNNER_TEMP/blender/blender" --background --command extension build \
            --source-dir "$GITHUB_WORKSPACE/$ADDON_DIR" \
            --output-dir "$GITHUB_WORKSPACE/release_out" \
            --split-platforms \
            --verbose
          ls -la release_out/
          test "$(ls release_out/*.zip | wc -l)" -eq 4
          # Size guard: a platform zip is ~50-70 MB (its own wheels + assets + source).
          # Anything much bigger means a stray file got packed from the workspace.
          for z in release_out/*.zip; do
            size=$(stat -c%s "$z")
            test "$size" -lt 157286400 || { echo "::error::$z is $size bytes (>150 MB) - something extra got packed into the extension"; exit 1; }
          done

      - name: Render release notes
        run: |
          set -euo pipefail
          git fetch --tags --quiet || true
          PREV=$(git tag --sort=-v:refname | grep -v "^v${VERSION}$" | head -1 || true)
          PREV="${PREV:-v0.0.0}"
          python - "$VERSION" "${PREV#v}" <<'EOF'
          import pathlib, sys
          version, previous = sys.argv[1], sys.argv[2]
          text = pathlib.Path("docs/.release_note.md").read_text(encoding="utf-8")
          text = text.replace("{version}", version).replace("{previous_version}", previous)
          pathlib.Path("release_notes.md").write_text(text, encoding="utf-8")
          EOF
          cat release_notes.md

      - name: Check the wheel before publishing
        run: twine check "$ADDON_DIR"/wheels/puree_ui-*.whl

      # ---- dry run (workflow_dispatch): keep the results, publish nothing ----
      - name: Upload dry-run artifacts
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ env.VERSION }}
          path: |
            release_out/*.zip
            ${{ env.ADDON_DIR }}/wheels/puree_ui-*.whl
            release_notes.md
            ${{ env.ADDON_DIR }}/blender_manifest.toml

      # ---- real release (tag push) ----
      - name: Publish puree-ui to PyPI
        if: env.DRY_RUN != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive "$ADDON_DIR"/wheels/puree_ui-*.whl

      - name: GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Puree UI ${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            release_out/*.zip
            ${{ env.ADDON_DIR }}/wheels/puree_ui-*.whl
