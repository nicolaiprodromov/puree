app:
  selected_theme: example4_theme
  default_theme: example4_theme

  theme:
    - name: example4_theme
      author: GitHub Copilot
      version: 1.0.0
      default_font: NeueMontreal-Regular
      scripts:
        - examples/example4/script.py
      styles:
        - examples/example4/style.scss

      root:
        class: root

        panel:
          class: panel

          panel_header:
            class: panel_header
            text: EXPLORER
            font: NeueMontreal-Bold
            passive: true

          # Outer scroll: ~700px content in 380px viewport
          outer_scroll:
            class: outer_scroll

            section_a_label:
              class: section_label
              text: WORKSPACE
              font: NeueMontreal-Bold
              passive: true

            file_1:
              class: file_item
              text: __init__.py
              passive: true

            file_2:
              class: file_item
              text: parser.py
              passive: true

            file_3:
              class: file_item
              text: render.py
              passive: true

            file_4:
              class: file_item
              text: parser_op.py
              passive: true

            file_5:
              class: file_item
              text: hit_op.py
              passive: true

            file_6:
              class: file_item
              text: text_op.py
              passive: true

            file_7:
              class: file_item
              text: img_op.py
              passive: true

            file_8:
              class: file_item
              text: native_bindings.py
              passive: true

            # Inner section — nested scroll inside outer scroll
            inner_section:
              class: inner_section

              inner_label:
                class: inner_label
                text: PINNED FILES
                font: NeueMontreal-Bold
                passive: true

              # Inner scroll: 12 items × 26px = 312px content in 150px viewport
              inner_scroll:
                class: inner_scroll

                inner_1:
                  class: inner_item
                  text: render.py
                  passive: true

                inner_2:
                  class: inner_item
                  text: parser.py
                  passive: true

                inner_3:
                  class: inner_item
                  text: style.scss
                  passive: true

                inner_4:
                  class: inner_item
                  text: cascade.rs
                  passive: true

                inner_5:
                  class: inner_item
                  text: index.yaml
                  passive: true

                inner_6:
                  class: inner_item
                  text: container_data.rs
                  passive: true

                inner_7:
                  class: inner_item
                  text: layout.rs
                  passive: true

                inner_8:
                  class: inner_item
                  text: __init__.py
                  passive: true

                inner_9:
                  class: inner_item
                  text: script.py
                  passive: true

                inner_10:
                  class: inner_item
                  text: hit_op.py
                  passive: true

                inner_11:
                  class: inner_item
                  text: text_op.py
                  passive: true

                inner_12:
                  class: inner_item
                  text: native_bindings.py
                  passive: true

            section_b_label:
              class: section_label
              text: RECENT
              font: NeueMontreal-Bold
              passive: true

            file_9:
              class: file_item
              text: container_data.rs
              passive: true

            file_10:
              class: file_item
              text: cascade.rs
              passive: true

            file_11:
              class: file_item
              text: layout.rs
              passive: true

            file_12:
              class: file_item
              text: text_layout.rs
              passive: true

            file_13:
              class: file_item
              text: style.scss
              passive: true

            file_14:
              class: file_item
              text: index.yaml
              passive: true

            file_15:
              class: file_item
              text: script.py
              passive: true

            file_16:
              class: file_item
              text: requirements.txt
              passive: true
