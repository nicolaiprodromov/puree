stat_tile:
  class: stat_tile

  stat_tile_head:
    class: stat_tile_head

    stat_tile_label:
      class: stat_tile_label
      text: "{{stat_label, 'Signal'}}"
      font: "{{stat_label_font, 'NeueMontreal-Regular'}}"
      passive: true

    stat_tile_icon:
      class: stat_tile_icon
      img: "{{stat_icon, 'dial'}}"
      passive: true

  stat_tile_value:
    class: stat_tile_value
    text: "{{stat_value, '01'}}"
    font: "{{stat_value_font, 'NeueMontreal-BoldItalic'}}"
    passive: true