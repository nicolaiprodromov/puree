app:
  selected_theme: example5_theme
  default_theme: example5_theme

  theme:
    - name: example5_theme
      author: Copilot
      version: 2.0.0
      default_font: NeueMontreal-Regular
      scripts:
        - examples/example5/script.py
      styles:
        - examples/example5/style.scss
      components: examples/example5/components/

      root:
        class: root

        shell:
          class: shell

          # ═══════════════════════════════
          #  SIDEBAR
          # ═══════════════════════════════
          sidebar:
            class: sidebar

            sidebar_header:
              class: sidebar_header

              sidebar_label:
                class: sidebar_label
                text: Chats
                font: NeueMontreal-Bold
                passive: true

              new_chat_btn:
                class: new_chat_btn

                new_chat_text:
                  class: new_chat_text
                  text: "+ New"
                  font: NeueMontreal-Bold
                  passive: true

            chat_list:
              class: chat_list

              chat_active:
                data: '[chat_item]'
                ci_icon: dial
                ci_title: Scene Optimization
                ci_date: Today
                ci_bg: rgba(88, 155, 240, 0.06)
                ci_border: rgba(88, 155, 240, 0.12)
                ci_title_color: '#edf0f8'

              chat_materials:
                data: '[chat_item]'
                ci_icon: light_on
                ci_title: Material Generator
                ci_date: Yesterday

              chat_uvs:
                data: '[chat_item]'
                ci_icon: eye_on
                ci_title: UV Unwrap Helper
                ci_date: Mar 22

              chat_shaders:
                data: '[chat_item]'
                ci_icon: click
                ci_title: Shader Debug
                ci_date: Mar 21

              chat_assets:
                data: '[chat_item]'
                ci_icon: toggle
                ci_title: Asset Organizer
                ci_date: Mar 20

              chat_lighting:
                data: '[chat_item]'
                ci_icon: hover
                ci_title: Lighting Setup
                ci_date: Mar 18

          # ═══════════════════════════════
          #  MAIN
          # ═══════════════════════════════
          main:
            class: main

            main_header:
              class: main_header

              header_title:
                class: header_title
                text: Scene Optimization
                font: NeueMontreal-Bold
                passive: true

              model_selector:
                class: model_selector

                model_dot:
                  class: model_dot
                  passive: true

                model_name:
                  class: model_name
                  text: Claude Sonnet
                  font: NeueMontreal-Bold
                  passive: true

            messages_scroll:
              class: messages_scroll

              slot_0:
                data: '[msg_slot]'
              slot_1:
                data: '[msg_slot]'
                ms_icon: star_on
                ms_role: Assistant
                ms_role_color: rgba(170, 140, 255, 0.82)
              slot_2:
